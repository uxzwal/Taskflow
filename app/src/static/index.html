<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — DevOps Task Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem 1rem}
header{text-align:center;margin-bottom:2.5rem}
header h1{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem}
header p{color:#94a3b8;font-size:.95rem}
.health-bar{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.8rem;font-size:.85rem}
.dot{width:10px;height:10px;border-radius:50%;background:#ef4444;display:inline-block}
.dot.ok{background:#22c55e}
.card{background:#1e293b;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;border:1px solid #334155}
.card h2{font-size:1.1rem;margin-bottom:1rem;color:#94a3b8}
.form-row{display:flex;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.form-row input,.form-row textarea,.form-row select{flex:1;padding:.65rem .9rem;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.9rem;min-width:180px}
.form-row textarea{min-height:42px;resize:vertical}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:#818cf8}
.btn{padding:.65rem 1.4rem;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .15s}
.btn-primary{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0f172a}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-danger{background:#ef4444;color:#fff;padding:.4rem .8rem;font-size:.8rem}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:.35rem .7rem;font-size:.78rem;border-radius:6px}
.task-list{display:flex;flex-direction:column;gap:.75rem}
.task-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;background:#0f172a;border-radius:10px;border:1px solid #334155;transition:border-color .15s}
.task-item:hover{border-color:#475569}
.task-info{flex:1}
.task-title{font-weight:600;font-size:1rem;margin-bottom:.2rem}
.task-desc{font-size:.85rem;color:#94a3b8}
.task-meta{font-size:.75rem;color:#64748b;margin-top:.3rem}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:20px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.badge-pending{background:#1e3a5f;color:#38bdf8}
.badge-in_progress{background:#3b2f1e;color:#fb923c}
.badge-completed{background:#14352a;color:#22c55e}
.actions{display:flex;gap:.4rem;flex-wrap:wrap}
.empty{text-align:center;padding:3rem;color:#64748b}
.stats{display:flex;gap:1rem;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap}
.stat{background:#1e293b;border-radius:10px;padding:.8rem 1.4rem;text-align:center;border:1px solid #334155;min-width:120px}
.stat-num{font-size:1.6rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:.75rem;color:#94a3b8;margin-top:.15rem}
footer{text-align:center;margin-top:2rem;font-size:.8rem;color:#475569}
footer a{color:#818cf8;text-decoration:none}
select.status-select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:.35rem .5rem;font-size:.78rem;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>&#9889; TaskFlow</h1>
    <p>DevOps Task Management Platform</p>
    <div class="health-bar">
      <span class="dot" id="health-dot"></span>
      <span id="health-text">Checking API...</span>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-num" id="stat-total">-</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="stat-pending">-</div><div class="stat-label">Pending</div></div>
    <div class="stat"><div class="stat-num" id="stat-progress">-</div><div class="stat-label">In Progress</div></div>
    <div class="stat"><div class="stat-num" id="stat-done">-</div><div class="stat-label">Completed</div></div>
  </div>

  <div class="card">
    <h2>Create Task</h2>
    <form id="create-form">
      <div class="form-row">
        <input type="text" id="title" placeholder="Task title" required>
        <select id="status">
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-row">
        <textarea id="description" placeholder="Description (optional)" rows="1"></textarea>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <div class="task-list" id="task-list">
      <div class="empty">Loading tasks...</div>
    </div>
  </div>

  <footer>
    TaskFlow DevOps Platform &middot; <a href="/health">/health</a> &middot; <a href="/metrics">/metrics</a> &middot; <a href="http://localhost:9090" target="_blank">Prometheus</a> &middot; <a href="http://localhost:3000" target="_blank">Grafana</a>
  </footer>
</div>

<script>
const API = '/api';

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return { status: res.status, data: await res.json() };
}

async function checkHealth() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    document.getElementById('health-dot').classList.toggle('ok', d.status === 'healthy');
    document.getElementById('health-text').textContent = d.status === 'healthy' ? 'API Healthy' : 'API Unhealthy';
  } catch {
    document.getElementById('health-dot').classList.remove('ok');
    document.getElementById('health-text').textContent = 'API Unreachable';
  }
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

async function loadTasks() {
  try {
    const { data } = await api('/tasks');
    const list = document.getElementById('task-list');
    if (!data.length) { list.innerHTML = '<div class="empty">No tasks yet — create one above!</div>'; }
    else {
      list.innerHTML = data.map(t => `
        <div class="task-item" data-id="${t.id}">
          <div class="task-info">
            <div class="task-title">${esc(t.title)}</div>
            ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
            <div class="task-meta">Created ${timeAgo(t.created_at)} &middot; ID #${t.id}</div>
          </div>
          <span class="badge badge-${t.status}">${t.status.replace('_', ' ')}</span>
          <select class="status-select" onchange="updateStatus(${t.id}, this.value)">
            <option value="pending" ${t.status==='pending'?'selected':''}>Pending</option>
            <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
            <option value="completed" ${t.status==='completed'?'selected':''}>Completed</option>
          </select>
          <button class="btn btn-danger btn-sm" onclick="deleteTask(${t.id})">Delete</button>
        </div>`).join('');
    }
    // Stats
    document.getElementById('stat-total').textContent = data.length;
    document.getElementById('stat-pending').textContent = data.filter(t => t.status === 'pending').length;
    document.getElementById('stat-progress').textContent = data.filter(t => t.status === 'in_progress').length;
    document.getElementById('stat-done').textContent = data.filter(t => t.status === 'completed').length;
  } catch { document.getElementById('task-list').innerHTML = '<div class="empty">Failed to load tasks.</div>'; }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

document.getElementById('create-form').addEventListener('submit', async e => {
  e.preventDefault();
  const title = document.getElementById('title').value.trim();
  if (!title) return;
  await api('/tasks', {
    method: 'POST',
    body: JSON.stringify({
      title,
      description: document.getElementById('description').value.trim(),
      status: document.getElementById('status').value,
    }),
  });
  document.getElementById('title').value = '';
  document.getElementById('description').value = '';
  document.getElementById('status').value = 'pending';
  loadTasks();
});

async function updateStatus(id, status) {
  await api(`/tasks/${id}`, { method: 'PUT', body: JSON.stringify({ status }) });
  loadTasks();
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  await api(`/tasks/${id}`, { method: 'DELETE' });
  loadTasks();
}

checkHealth();
loadTasks();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
